name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Measured durations and headroom: docs/testing/release-validation.md.
        include:
          - os: ubuntu-24.04
            job-timeout: 20
            tools-timeout: 8
          - os: macos-15
            job-timeout: 30
            tools-timeout: 12
          - os: macos-15-intel
            job-timeout: 45
            tools-timeout: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job-timeout }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Restore pinned tool downloads before bootstrap
        uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
        with:
          extra-key: ${{ hashFiles('Makefile') }}
      - id: compiler-setup
        name: Prepare selected compiler
        timeout-minutes: ${{ matrix.tools-timeout }}
        run: perl scripts/ci/setup-command.pl compiler bash scripts/ci/prepare-compiler.sh
      - id: locked-fetch
        name: Fetch locked dependencies
        timeout-minutes: 5
        run: |
          perl scripts/ci/setup-command.pl fetch-product cargo fetch --locked
          perl scripts/ci/setup-command.pl fetch-qualification cargo fetch --locked --manifest-path qualification/Cargo.toml
      - name: Prepare admitted tools with compiled cache
        timeout-minutes: ${{ matrix.tools-timeout }}
        uses: ./vendor/toko-tooling/.github/actions/prepare-common-tools
        with:
          cache: 'true'
          cache-save: 'true'
          cache-extra-key: ${{ hashFiles('Makefile') }}
      - name: Check early setup failure diagnostics
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: bash scripts/ci/test-early-setup.sh
      - name: Check scanner setup diagnostics
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: bash scripts/ci/test-scanner-setup.sh
      - name: Prepare admitted PocketIC server
        timeout-minutes: 5
        run: make install-qualification-tools
      - id: setup-diagnostics
        name: Retain setup diagnostics
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/early-setup/compiler/status.txt
            ${{ runner.temp }}/early-setup/compiler/identity.log
            ${{ runner.temp }}/early-setup/compiler/.attempt/diagnostic.log
            ${{ runner.temp }}/early-setup/fetch-product/status.txt
            ${{ runner.temp }}/early-setup/fetch-product/.attempt/diagnostic.log
            ${{ runner.temp }}/early-setup/fetch-qualification/status.txt
            ${{ runner.temp }}/early-setup/fetch-qualification/.attempt/diagnostic.log
            target/setup-pocket-ic/**/*.log
            ${{ runner.temp }}/tools-install.log
            ${{ runner.temp }}/tools-check.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - id: setup-report
        name: Report setup diagnostics
        if: always()
        timeout-minutes: 1
        env:
          ARTIFACT_OUTCOME: ${{ steps.setup-diagnostics.outcome }}
          ARTIFACT_URL: ${{ steps.setup-diagnostics.outputs.artifact-url }}
        run: perl scripts/ci/setup-command.pl report
      - id: build-key
        name: Select native compilation cache
        shell: bash
        run: |
          echo "key=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            target/debug
            target/release
            target/wasm32-unknown-unknown
            target/qualification
            target/ci-build-cache.json
          key: entropy-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-key.outputs.key }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', '**/Cargo.lock', 'Makefile', 'rust-toolchain.toml', '.toko-tooling.snapshot') }}
          restore-keys: |
            entropy-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-key.outputs.key }}-
      - name: Admit restored build bytes
        run: bash scripts/ci/build-cache.sh restore
      - name: Validate entropy and retirement notice
        timeout-minutes: 15
        shell: bash
        run: |
          make ci fmt-check 2>&1 | tee "$RUNNER_TEMP/validation.log"
      - name: Retain validation diagnostics
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation.log
          if-no-files-found: ignore
          retention-days: 14
      - id: seal-build-cache
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.build-cache.outputs.cache-hit != 'true'
        run: |
          if bash scripts/ci/build-cache.sh seal; then echo 'save=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.seal-build-cache.outputs.save == 'true'
        continue-on-error: true
        with:
          path: |
            target/debug
            target/release
            target/wasm32-unknown-unknown
            target/qualification
            target/ci-build-cache.json
          key: entropy-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-key.outputs.key }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', '**/Cargo.lock', 'Makefile', 'rust-toolchain.toml', '.toko-tooling.snapshot') }}
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore pinned tool downloads
        uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
      - id: scanner-setup
        name: Prepare pinned scanner
        timeout-minutes: 3
        run: bash scripts/ci/setup-scanner.sh
      - id: scanner-diagnostics
        name: Retain scanner setup diagnostics
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner-setup-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scanner-setup/status.txt
            ${{ runner.temp }}/scanner-setup/.attempt/install.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Report scanner setup evidence
        if: always()
        env:
          ARTIFACT_OUTCOME: ${{ steps.scanner-diagnostics.outcome }}
          ARTIFACT_URL: ${{ steps.scanner-diagnostics.outputs.artifact-url }}
        run: |
          status=0
          perl scripts/ci/scanner-setup-log.pl report "$RUNNER_TEMP/scanner-setup" || status=$?
          if [[ "$ARTIFACT_OUTCOME" == success && -n "$ARTIFACT_URL" ]]; then
            printf '[Scanner setup diagnostics](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Scanner setup artifact upload failed or produced no link.'
            status=1
          fi
          exit "$status"
      - name: Scan history once
        run: '"$RUNNER_TEMP/entropy-tools/gitleaks" git --redact=100 --no-banner --no-color --log-level error'
      - name: Save pinned tool downloads
        uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
        with:
          mode: save
