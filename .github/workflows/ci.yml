name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare selected compiler
        run: |
          compiler="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$compiler"
          rustup toolchain install "$compiler" --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain "$compiler" wasm32-unknown-unknown
          rustc -vV
          cargo -vV
          test "$(rustc --version | cut -d ' ' -f 2)" = "$compiler"
          test "$(cargo --version | cut -d ' ' -f 2)" = "$compiler"
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path qualification/Cargo.toml
      - name: Prepare admitted tools with compiled cache
        uses: ./.github/actions/prepare-common-tools
        with:
          cache: 'true'
          cache-save: 'true'
          cache-extra-key: ${{ hashFiles('Makefile') }}
      - name: Prepare admitted PocketIC server
        run: make install-qualification-tools
      - name: Retain setup diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            target/setup-pocket-ic/**/*.log
            ${{ runner.temp }}/tools-install.log
            ${{ runner.temp }}/tools-check.log
          if-no-files-found: ignore
          retention-days: 14
      - id: build-key
        name: Select native compilation cache
        shell: bash
        run: |
          echo "key=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            target/debug
            target/release
            target/wasm32-unknown-unknown
            target/qualification
            target/ci-build-cache.json
          key: entropy-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-key.outputs.key }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', '**/Cargo.lock', 'Makefile', 'rust-toolchain.toml', '.toko-tooling.snapshot') }}
          restore-keys: |
            entropy-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-key.outputs.key }}-
      - name: Admit restored build bytes
        run: bash scripts/ci/build-cache.sh restore
      - name: Validate core and IC adapter
        run: |
          make ci fmt-check
          PATH="$PWD/.tools/host/bin:$PATH" bash scripts/ci/check-dependency-pins.sh
      - id: seal-build-cache
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.build-cache.outputs.cache-hit != 'true'
        run: |
          if bash scripts/ci/build-cache.sh seal; then echo 'save=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.seal-build-cache.outputs.save == 'true'
        continue-on-error: true
        with:
          path: |
            target/debug
            target/release
            target/wasm32-unknown-unknown
            target/qualification
            target/ci-build-cache.json
          key: entropy-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-key.outputs.key }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', '**/Cargo.lock', 'Makefile', 'rust-toolchain.toml', '.toko-tooling.snapshot') }}
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore pinned tool downloads
        uses: ./.github/actions/cache-tool-downloads
      - name: Scan history once
        run: |
          scanner="$(bash scripts/ci/install-ci-tool.sh gitleaks --install-dir "$RUNNER_TEMP/entropy-tools")"
          "$scanner" git --redact --no-banner .
      - name: Save pinned tool downloads
        uses: ./.github/actions/cache-tool-downloads
        with:
          mode: save
