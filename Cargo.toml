[workspace]
members = ["crates/ic-entropy", "crates/ic-entropy-ic"]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
version = "0.1.12"
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-entropy"

[workspace.dependencies]
# Local packages
ic-entropy = { path = "crates/ic-entropy", version = "0.1.12" }
ic-entropy-ic = { path = "crates/ic-entropy-ic", version = "0.1.12", default-features = false }

# Production dependencies
ic-platform = { version = "0.32.0", default-features = false }
ic-platform-runtime = { version = "0.21.3", default-features = false }
ic-timers = { version = "0.43.0", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }

# Development tooling
toko-tooling = "=0.40.1"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unfulfilled_lint_expectations = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
