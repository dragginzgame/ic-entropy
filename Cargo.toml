[workspace]
members = ["crates/ic-entropy", "crates/ic-entropy-ic"]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-entropy"

[workspace.dependencies]
# Production
ic-logging = { version = "0.26.0", default-features = false }
ic-metrics = { version = "0.30.23", default-features = false }
ic-platform-runtime = { version = "0.23.27", default-features = false }
ic-timers = { version = "0.46.16", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }

# Tests and tooling
ic-platform-protocol = { version = "0.3.11", default-features = false }
toko-tooling = "=0.46.5"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unfulfilled_lint_expectations = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
empty_line_after_doc_comments = "allow"
