[workspace]
members = ["crates/ic-entropy"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license-file = "LICENSE"

[workspace.dependencies]
# Local packages
ic-entropy = { path = "crates/ic-entropy", version = "0.0.0" }

# Production dependencies
rand_chacha = { version = "0.10.0", default-features = false }

# Development tooling
toko-tooling = "=0.37.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unfulfilled_lint_expectations = "warn"
