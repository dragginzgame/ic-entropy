[workspace]
members = ["crates/ic-entropy", "crates/ic-entropy-ic"]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
version = "0.1.10"
edition = "2024"
rust-version = "1.99.1"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-entropy"

[workspace.dependencies]
# Local packages
ic-entropy = { path = "crates/ic-entropy", version = "0.1.10" }
ic-entropy-ic = { path = "crates/ic-entropy-ic", version = "0.1.10", default-features = false }

# Production dependencies
ic-platform = { version = "0.31.3", default-features = false }
ic-platform-runtime = { version = "0.21.3", default-features = false }
ic-timers = { version = "0.43.0", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }

# Development tooling
toko-tooling = "=0.39.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unfulfilled_lint_expectations = "warn"

[workspace.lints.clippy]
future_not_send = "warn"
