[workspace]
members = ["entropy-probe"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
entropy-probe = { path = "entropy-probe" }
ic-entropy-ic = { path = "../crates/ic-entropy-ic", default-features = false }
ic-platform = { version = "0.29.2", default-features = false }
ic-platform-runtime = { version = "0.21.0", default-features = false }
ic-platform-types = { version = "0.19.0", default-features = false }
ic-testkit = { version = "0.96.0", default-features = false }
ic-wire = { version = "0.19.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toko-tooling = "=0.38.2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
