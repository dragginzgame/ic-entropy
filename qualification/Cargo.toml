[workspace]
members = ["entropy-probe"]
resolver = "3"

[workspace.package]
license-file = "../LICENSE.md"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
entropy-probe = { path = "entropy-probe" }
ic-entropy-ic = { path = "../crates/ic-entropy-ic", default-features = false }
ic-platform = { version = "0.32.0", default-features = false }
ic-platform-runtime = { version = "0.21.3", default-features = false }
ic-platform-types = { version = "0.19.5", default-features = false }
ic-testkit = { version = "0.101.0", default-features = false }
ic-wire = { version = "0.21.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toko-tooling = "=0.40.1"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
