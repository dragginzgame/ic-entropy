[package]
name = "ic-entropy-ic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "IC entropy acquisition with opt-in timer-driven buffering and bounded random generation"
readme = "README.md"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.docs.rs]
all-features = true
default-target = "wasm32-unknown-unknown"

[features]
default = []
buffered = ["dep:ic-entropy", "dep:ic-platform-runtime", "dep:ic-timers"]

[dependencies]
ic-entropy = { workspace = true, optional = true }
ic-platform = { workspace = true, features = ["raw-rand"] }
ic-platform-runtime = { workspace = true, features = ["runtime"], optional = true }
ic-timers = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["runtime"] }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true

[[example]]
name = "consumer_owned"
crate-type = ["rlib"]
required-features = ["buffered"]
